<aside class="sidebar">
    <p class="sidebar-label">Games</p>
    <a class="game-link{% if not selected_game %} is-active{% endif %}" href="{% url 'home' %}">
        All games
    </a>
    {% for game in games %}
        <a
            class="game-link{% if selected_game.name == game.name %} is-active{% endif %}"
            href="{% url 'home' %}?game={{ game.name }}"
        >
            {{ game.name }}
        </a>
    {% empty %}
        <p class="muted">No games yet.</p>
    {% endfor %}

    <a class="button sidebar-add" href="{% url 'add_game' %}">Add game</a>
</aside>
