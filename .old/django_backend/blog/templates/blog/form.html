{% extends "blog/base.html" %}

{% block title %}{{ title }} · Maps Admin{% endblock %}

{% block content %}
<p class="kicker"><a href="{% url 'home' %}{% if selected_game %}?game={{ selected_game.name }}{% endif %}">Dashboard</a></p>
<h1>{{ title }}</h1>

<form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %} class="panel-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button">{{ submit_label }}</button>
</form>
{% endblock %}
