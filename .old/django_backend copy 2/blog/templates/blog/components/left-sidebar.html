<div>
    {% for game in games %}
        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="selected_game" value="{{ game.name }}">

            <button type="submit">
                {{ game.name }}
            </button>
        </form>
    {% endfor %}

    <a href="{% url 'add_game' %}">
        <button type="button">Add game</button>
    </a>
</div>
